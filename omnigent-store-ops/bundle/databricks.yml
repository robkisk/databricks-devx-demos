# Synthetic stock-out data for the store-ops analyst: UC tables, a risk view, four UC functions
# (the agent's tools), a Genie Agent, and an AI/BI dashboard. Deploy with your own profile:
#   databricks bundle deploy -p <profile> --var catalog=<catalog>
bundle:
  name: retail_stockout
  engine: direct

include:
  - resources/*.yml

variables:
  catalog:
    description: UC catalog that holds the demo schema. You need CREATE SCHEMA on it.
  schema:
    description: Demo schema. The bundle creates it.
    default: retail_stockout
  warehouse_id:
    description: SQL warehouse for the build job, the Genie Agent, and the dashboard.
    lookup:
      warehouse: Serverless Starter Warehouse
  customer_name:
    description: The made-up grocery chain's name, shown in titles and in demo_config.
    default: Fresh Basket Markets
  as_of_date:
    description: The date every table is anchored to. The README's expected answers hold for 2026-10-30.
    default: "2026-10-30"

workspace:
  # Keyed by schema, so a second deploy with --var schema=... keeps its own state.
  root_path: ~/.bundle/${bundle.name}/${var.schema}

targets:
  demo:
    default: true
